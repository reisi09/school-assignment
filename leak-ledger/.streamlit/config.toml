# 유출장부 화면 설정
#
# vessl.ai 화면에서 잰 색을 따랐다. VESSL의 파란색 자리에는 민트를 쓴다.
#   #0a0a0a  글자
#   #696969  보조 글자 (흰 배경 대비 5.5:1)
#   #ffffff  바탕과 카드, #f5f5f5 회색 면과 입력칸 바탕
#   #e5e5e5  선, #8f8f8f 입력칸 테두리 (흰 배경 대비 3.2:1)
#   #101828  주요 버튼
#   #06e7c4  민트: 소개 화면 머리 구역, 고른 칸, 체크, 진행 막대 (글자는 항상 진한 색을 올린다)
# 위험 표시는 빨강 #e40014, 노랑 #ffd21f를 쓴다 (style.css).

[server]
enableStaticServing = true

# 개발용 메뉴(Deploy 버튼 등)는 숨긴다.
[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/PretendardVariable.woff2"
weight = "45 920"
style = "normal"

[theme]
base = "light"
font = "Pretendard, sans-serif"
baseFontSize = 16
headingFontSizes = ["1.75rem", "1.125rem", "1rem"]
headingFontWeights = [700, 600, 600]

primaryColor = "#06e7c4"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#0a0a0a"
linkColor = "#0a0a0a"
borderColor = "#8f8f8f"
dataframeBorderColor = "#e5e5e5"
dataframeHeaderBackgroundColor = "#f5f5f5"
dataframeHeaderTextColor = "#0a0a0a"
baseRadius = "0.625rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false

# 안내 상자: 성공은 민트, 주의는 노랑, 오류는 빨강, 정보는 회색
greenBackgroundColor = "#06e7c4"
greenTextColor = "#0a0a0a"
yellowBackgroundColor = "#ffd21f"
yellowTextColor = "#0a0a0a"
redBackgroundColor = "#e40014"
redTextColor = "#ffffff"
blueBackgroundColor = "#f5f5f5"
blueTextColor = "#0a0a0a"
