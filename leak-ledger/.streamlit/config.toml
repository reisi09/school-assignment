# 유출장부 화면 설정
#
# 색은 남색과 선명한 민트 두 가지가 중심이다. 로고와 같은 색이다.
#   #0d1627  남색: 글자, 주요 버튼, 현재 메뉴 밑줄
#   #06e7c4  민트: 소개 화면의 판, 체크, 진행 막대 (글자는 항상 남색을 올린다. 대비 11:1)
#   #d5dae0  화면 바탕, #f5f5f4 그 위의 둥근 종이 (style.css에서 칠한다)
#   #ffffff  카드
#   #5d6b82  보조 글자 (흰 배경 대비 5.4:1)
#   #8a94a5  입력칸 테두리 (흰 배경 대비 3.1:1)
# 위험과 상태 표시는 빨강 #d92d3a, 노랑 #ffd21f, 회색 #475467을 쓴다 (style.css).

[server]
enableStaticServing = true

# 개발용 메뉴(Deploy 버튼 등)는 숨긴다.
[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/PretendardVariable.woff2"
weight = "45 920"
style = "normal"

[theme]
base = "light"
font = "Pretendard, sans-serif"
baseFontSize = 16
headingFontSizes = ["1.75rem", "1.125rem", "1rem"]
headingFontWeights = [700, 600, 600]

primaryColor = "#06e7c4"
backgroundColor = "#f7f8fb"
secondaryBackgroundColor = "#f2f4f8"
textColor = "#0d1627"
linkColor = "#0d1627"
borderColor = "#8a94a5"
dataframeBorderColor = "#e4e9f0"
dataframeHeaderBackgroundColor = "#f2f4f8"
dataframeHeaderTextColor = "#344054"
baseRadius = "0.625rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false

# 안내 상자: 성공은 민트, 주의는 노랑, 오류는 빨강, 정보는 회색
greenBackgroundColor = "#06e7c4"
greenTextColor = "#0d1627"
yellowBackgroundColor = "#ffd21f"
yellowTextColor = "#0d1627"
redBackgroundColor = "#d92d3a"
redTextColor = "#ffffff"
blueBackgroundColor = "#e4e9f0"
blueTextColor = "#0d1627"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f2f4f8"
