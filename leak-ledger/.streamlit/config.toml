# 유출장부 화면 설정
#
# 바탕은 옅은 회청색, 내용은 흰 카드에 담는다. 글자는 남색 계열이다.
#   #f4f8fb  화면 바탕
#   #ffffff  카드, 사이드바
#   #f4f7fa  입력칸 바탕
#   #101828  본문 글자, 주요 버튼
#   #5d6b82  보조 글자 (흰 배경 대비 5.4:1)
#   #8a94a5  입력칸 테두리 (흰 배경 대비 3.1:1)
#
# 강조에는 파스텔 색을 쓴다. 기본 팔레트(청록 5색)는 다음과 같이 쓴다.
#   #07beb8  체크, 진행 막대
#   #3dccc7  진행 막대 끝 색
#   #68d8d6  화면 머리 영역의 테두리
#   #9ceaef  화면 머리 영역 바탕(오른쪽)
#   #c4fff9  화면 머리 영역 바탕(왼쪽), 현재 메뉴, 정보 안내
# 상태 표시용 파스텔(연두·노랑·분홍·하늘)은 style.css에 적었다.

[server]
enableStaticServing = true

# 개발용 메뉴(Deploy 버튼 등)는 숨긴다.
[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/PretendardVariable.woff2"
weight = "45 920"
style = "normal"

[theme]
base = "light"
font = "Pretendard, sans-serif"
baseFontSize = 16
headingFontSizes = ["1.75rem", "1.125rem", "1rem"]
headingFontWeights = [700, 600, 600]

primaryColor = "#07beb8"
backgroundColor = "#f4f8fb"
secondaryBackgroundColor = "#f4f7fa"
textColor = "#101828"
linkColor = "#1a4fb8"
borderColor = "#8a94a5"
dataframeBorderColor = "#e4e9f0"
dataframeHeaderBackgroundColor = "#f4f7fa"
dataframeHeaderTextColor = "#344054"
baseRadius = "0.625rem"
buttonRadius = "full"
showWidgetBorder = true
showSidebarBorder = false

# 안내 상자도 파스텔 색으로 맞춘다.
blueBackgroundColor = "#c4fff9"
blueTextColor = "#075e5b"
greenBackgroundColor = "#d9f6e5"
greenTextColor = "#0b6b3a"
yellowBackgroundColor = "#fff3c4"
yellowTextColor = "#6b4e00"
redBackgroundColor = "#ffe1e8"
redTextColor = "#9b1c3a"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7fa"
