# 유출장부 화면 설정
#
# 팔레트
#   light-sea-green #07beb8  강조색(주요 버튼, 체크, 선택 표시)
#   strong-cyan     #3dccc7  주요 버튼에 마우스를 올렸을 때
#   pearl-aqua      #68d8d6  표 안쪽 선, 사이드바와 접는 영역의 테두리
#   icy-aqua        #9ceaef  성공 안내 배경, 글자 선택 영역
#   icy-aqua-2      #c4fff9  현재 메뉴 표시, 정보 안내 배경
#
# 팔레트는 모두 밝은 색이라 글자색으로는 대비가 부족하다.
# 글자와 입력창 테두리에는 같은 색상 계열의 어두운 색을 따로 둔다.
#   #0b3231  본문 글자 (흰 배경 대비 13.9:1, #07beb8 위 6.0:1)
#   #06706d  링크 (흰 배경 대비 5.9:1)
#   #078f8b  입력창 테두리 (흰 배경 대비 3.9:1)

[server]
enableStaticServing = true

# 개발용 메뉴(Deploy 버튼 등)는 숨긴다.
[client]
toolbarMode = "minimal"

[[theme.fontFaces]]
family = "Pretendard"
url = "app/static/PretendardVariable.woff2"
weight = "45 920"
style = "normal"

[theme]
base = "light"
font = "Pretendard, sans-serif"
baseFontSize = 16
headingFontSizes = ["1.75rem", "1.25rem", "1.0625rem"]
headingFontWeights = [700, 600, 600]

primaryColor = "#07beb8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b3231"
linkColor = "#06706d"
borderColor = "#078f8b"
dataframeBorderColor = "#68d8d6"
dataframeHeaderBackgroundColor = "#ffffff"
dataframeHeaderTextColor = "#0b3231"
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = false

# 안내 상자: 정보와 성공은 팔레트 색, 경고와 오류는 기본 색을 그대로 둔다.
blueBackgroundColor = "#c4fff9"
blueTextColor = "#0b3231"
greenBackgroundColor = "#9ceaef"
greenTextColor = "#0b3231"

# 사이드바는 본문과 같은 흰 바탕에 두고, 색은 현재 메뉴 한 줄에만 쓴다 (style.css).
[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#ffffff"
